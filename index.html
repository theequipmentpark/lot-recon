const dstr = it => it.distance_mi==null ? '?' : it.distance_mi;
const ENDING_H = 72;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function liveStatus(it){ if(!it.closes) return 'ACTIVE'; const h=(new Date(it.closes)-Date.now())/36e5; if(h<0) return 'CLOSED'; return h<=ENDING_H?'ENDING SOON':'ACTIVE'; }
function fmtClose(c){ if(!c) return '—'; const d=new Date(c); const h=(d-Date.now())/36e5;
  const t=d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})+' ET';
  if(h<0) return t+' (ended)'; return t+` (T-${h<48?Math.round(h)+'h':Math.round(h/24)+'d'})`; }

/* ---------- map ---------- */
const Leaflet = window.L;
const m = Leaflet.map('map',{zoomControl:true,worldCopyJump:true}).setView([O.lat,O.lon],6);
// CARTO dark_matter now returns an "API KEY REQUIRED" placeholder without a key, so use Esri Dark Gray Canvas (keyless).
// To use CARTO with a key: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
Leaflet.tileLayer(ESRI+'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'Tiles &copy; Esri, HERE, Garmin, &copy; OpenStreetMap'}).addTo(m);
Leaflet.tileLayer(ESRI+'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:16}).addTo(m);
Leaflet.circle([O.lat,O.lon],{radius:O.radius_mi*1609.344,color:'#00ff9c',weight:1.2,dashArray:'6 6',fillColor:'#00ff9c',fillOpacity:.04}).addTo(m)
  .bindTooltip('WOLF RADIUS 300 MI',{sticky:true});
Leaflet.circle([O.lat,O.lon],{radius:100*1609.344,color:'#00e5ff',weight:.6,dashArray:'2 6',fill:false}).addTo(m);
Leaflet.marker([O.lat,O.lon],{icon:Leaflet.divIcon({className:'',html:'<div class="home"></div>',iconSize:[12,12]})}).addTo(m)
  .bindPopup(`<b>ORIGIN</b><br>${esc(O.label)}<br>${O.lat.toFixed(4)}, ${O.lon.toFixed(4)}`);
m.on('mousemove',e=>document.getElementById('coords').textContent=`LAT ${e.latlng.lat.toFixed(4)}  LON ${e.latlng.lng.toFixed(4)}`);
const markers={};
// clustering: pins of the same category mix; cluster color = dominant category, ring shows count
const cluster=Leaflet.markerClusterGroup({maxClusterRadius:45,showCoverageOnHover:false,spiderfyOnMaxZoom:true,
  iconCreateFunction:c=>{const ms=c.getAllChildMarkers(), cnt={}; ms.forEach(x=>cnt[x.options.cat]=(cnt[x.options.cat]||0)+1);
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0], col=CAT[top]||'#fff', n=ms.length, sz=n<10?26:n<50?32:40;
    return Leaflet.divIcon({className:'',iconSize:[sz,sz],html:`<div class="clu" style="width:${sz}px;height:${sz}px;background:${col};box-shadow:0 0 10px ${col},0 0 22px ${col}"><span>${n}</span></div>`});}});
m.addLayer(cluster);
LS.filter(hasPos).forEach(it=>{
  const col=CAT[it.category]||'#fff';
  const mk=Leaflet.marker([it.lat,it.lon],{cat:it.category,icon:Leaflet.divIcon({className:'',html:`<div class="pin" style="background:${col};color:${col};box-shadow:0 0 10px ${col},0 0 20px ${col}"></div>`,iconSize:[14,14]})});
  mk.bindPopup(`<div style="color:${col}">${it.flip?'<span class="flip">FLIP</span>':''}[${esc(it.category)} · ${esc((it.subtype||'').toUpperCase())}]</div>
   <b style="color:#d9ffe9">${esc(it.title)}</b><br>${esc(it.city)}, ${esc(it.state)} · ${it.distance_mi} mi<br>
   <span class="price">${esc(it.price)}</span> · ${esc(it.source)}<br>STATUS: ${liveStatus(it)}${it.closes?'<br>CLOSES: '+fmtClose(it.closes):''}
   ${it.notes?'<br><span style="color:#3fbf88">'+esc(it.notes)+'</span>':''}<br><a href="${esc(it.url)}" target="_blank" rel="noopener">&gt;&gt; OPEN SOURCE</a>`);
  mk.on('click',()=>select(it.id,false));
  markers[it.id]=mk;
});
/* ---------- location-group outlines ---------- */
const GORDER = DATA.group_order || [];
const gIdx = g => { const i=GORDER.indexOf(g); return i<0?999:i; };
const gLayers={}, gLabels={};
[...new Set(LS.filter(hasPos).map(i=>i.group))].forEach(g=>{
  const its=LS.filter(i=>i.group===g && hasPos(i));
  const lat=its.reduce((s,i)=>s+i.lat,0)/its.length, lon=its.reduce((s,i)=>s+i.lon,0)/its.length;
  const r=Math.max(...its.map(i=>m.distance([lat,lon],[i.lat,i.lon])))+25*1609.344;
  const c=Leaflet.circle([lat,lon],{radius:r,color:'#00e5ff',weight:.8,opacity:.45,dashArray:'1 5',fillColor:'#00e5ff',fillOpacity:.03,bubblingMouseEvents:true}).bindTooltip('// '+g.toUpperCase()+' ['+its.length+']',{sticky:true,className:'glabel'});
  const lab=Leaflet.tooltip({permanent:true,direction:'top',className:'glabel',offset:[0,0]}).setLatLng([lat+r/111320*0.92,lon]).setContent('// '+g.toUpperCase()+' ['+its.length+']');
  gLayers[g]=Leaflet.layerGroup([c]).addTo(m); gLabels[g]=lab;
});
// permanent group labels only when zoomed in enough that they don't collide; hover the ring otherwise
function syncLabels(){ Object.entries(gLabels).forEach(([g,lab])=>{ const show=m.getZoom()>=7 && m.hasLayer(gLayers[g]); show?lab.addTo(m):lab.remove(); }); }
m.on('zoomend',syncLabels);

/* ---------- feed ---------- */
const state={on:new Set(Object.keys(CAT)),q:'',sort:'dist',inr:false,fo:false,sel:null,view:'list',collapsed:new Set()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.view=b.dataset.v;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render();});
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const togs=document.getElementById('togs');
Object.entries(CAT).forEach(([k,c])=>{const b=document.createElement('button');b.className='tog on';b.style.color=c;b.textContent=k;
  b.onclick=()=>{state.on.has(k)?state.on.delete(k):state.on.add(k);b.classList.toggle('on');render();};togs.appendChild(b);});
document.getElementById('q').oninput=e=>{state.q=e.target.value.toLowerCase();render();};
document.getElementById('sort').onchange=e=>{state.sort=e.target.value;render();};
document.getElementById('inr').onchange=e=>{state.inr=e.target.checked;render();};
document.getElementById('fo').onchange=e=>{state.fo=e.target.checked;render();};
function visible(){
  let v=LS.filter(it=>state.on.has(it.category) && liveStatus(it)!=='CLOSED' && (!state.inr||it.distance_mi==null||it.distance_mi<=O.radius_mi) && (!state.fo||it.flip));
  if(state.q) v=v.filter(it=>[it.title,it.city,it.state,it.source,it.category,it.subtype,it.notes,it.price].join(' ').toLowerCase().includes(state.q));
  const s={dist:(a,b)=>(a.distance_mi??1e6)-(b.distance_mi??1e6),
    close:(a,b)=>(a.closes?new Date(a.closes):8e15)-(b.closes?new Date(b.closes):8e15),
    seen:(a,b)=>String(b.first_seen).localeCompare(String(a.first_seen))}[state.sort];
  return v.sort(s);
}
function card(it,i){
    const col=CAT[it.category], st=liveStatus(it);
    const d=document.createElement('div'); d.className='item'+(state.sel===it.id?' sel':''); d.style.color=col; d.style.animationDelay=(Math.min(i,15)*40)+'ms'; d.dataset.id=it.id;
    d.innerHTML=`<div>${it.flip?'<span class="flip">FLIP</span>':''}<span class="tag">${esc(it.category)}</span><span class="tag" style="color:#3fbf88">${esc((it.subtype||'').toUpperCase())}</span>
      <span class="${st==='ACTIVE'?'st-ACTIVE':'st-ENDING'}" style="float:right;font-size:11px">[${st}]</span></div>
     <div class="t" style="margin-top:4px">${esc(it.title)}</div>
     <div class="row"><span><span class="k">LOC</span> ${esc(it.city)}, ${esc(it.state)}</span><span><span class="k">DST</span> ${hasPos(it)?it.distance_mi+' mi':'? (NO PIN)'}${it.distance_mi>O.radius_mi?' <span class="out">OUT-R</span>':''}</span></div>
     <div class="row"><span class="price">${esc(it.price)}</span><span><span class="k">SRC</span> ${esc(it.source)}</span></div>
     <div class="row"><span><span class="k">POSTED</span> ${esc(it.posted||'?')}</span><span><span class="k">CLOSES</span> ${esc(fmtClose(it.closes))}</span></div>
     <div class="row"><span><span class="k">GRP</span> ${esc(it.group)}</span><span><span class="k">CHK</span> ${esc(it.last_checked)}</span></div>
     <div class="row"><span><span class="k">SEEN</span> ${esc(it.first_seen)}</span><a href="${esc(it.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">&gt;&gt; LINK</a></div>`;
    d.onclick=()=>select(it.id,true); return d;
}
function render(){
  const v=visible(), ids=new Set(v.map(i=>i.id));
  cluster.clearLayers(); cluster.addLayers(Object.entries(markers).filter(([id])=>ids.has(id)).map(([,mk])=>mk));
  const vg=new Set(v.map(i=>i.group));
  Object.entries(gLayers).forEach(([g,l])=>vg.has(g)?l.addTo(m):l.remove()); syncLabels();
  const f=document.getElementById('feed');
  f.innerHTML=v.length?'':'<div class="item out">&gt; NO TARGETS MATCH FILTER_</div>';
  if(state.view==='list'){ v.forEach((it,i)=>f.appendChild(card(it,i))); }
  else {
    const groups=[...vg].sort((a,b)=>gIdx(a)-gIdx(b));
    let n=0;
    groups.forEach(g=>{
      const its=v.filter(i=>i.group===g);
      const sub=its.reduce((s,i)=>s+(i.price_num||0),0), unk=its.filter(i=>i.price_num==null).length;
      const ds=its.filter(hasPos).map(i=>i.distance_mi), near=ds.length?Math.min(...ds):'?', far=ds.length?Math.max(...ds):'?';
      const h=document.createElement('div'); h.className='grp'+(state.collapsed.has(g)?' collapsed':'');
      h.innerHTML=`<span>${state.collapsed.has(g)?'[+]':'[-]'} ${esc(g.toUpperCase())}</span><span class="gs">${its.length} TGT · ${money(sub)}${unk?' +'+unk+'?':''} · ${near===far?near:near+'–'+far} MI</span>`;
      h.onclick=()=>{state.collapsed.has(g)?state.collapsed.delete(g):state.collapsed.add(g);render();};
      const body=document.createElement('div'); body.className='gbody';
      its.forEach(it=>body.appendChild(card(it,n++)));
      f.appendChild(h); f.appendChild(body);
    });
  }
  document.getElementById('shown').textContent=`[${v.length}/${LS.length}]`;
  status(v);
}
function select(id,fly){
  state.sel=id; const it=LS.find(x=>x.id===id); if(!it) return;
  document.querySelectorAll('.item').forEach(e=>e.classList.toggle('sel',e.dataset.id===id));
  const el=document.querySelector(`.item[data-id="${id}"]`); if(el && !fly) el.scrollIntoView({behavior:'smooth',block:'center'});
  const mk=markers[id]; if(!mk) return;   // unknown-location items have no pin
  if(fly){ m.flyTo([it.lat,it.lon],11,{duration:1.4}); setTimeout(()=>cluster.zoomToShowLayer(mk,()=>mk.openPopup()),1500); }
  else mk.openPopup();
}
function status(v){
  const c=k=>LS.filter(i=>i.category===k&&liveStatus(i)!=='CLOSED').length;
  const end=LS.filter(i=>liveStatus(i)==='ENDING SOON').length;
  document.getElementById('status').innerHTML=
   `<span>LAST UPDATED <b>${esc(DATA.built_display)}</b></span><span>TOTAL <b>${LS.length}</b></span><span>SHOWN <b>${v.length}</b></span>`+
   Object.keys(CAT).map(k=>`<span style="color:${CAT[k]}">${k} <b style="color:inherit">${c(k)}</b></span>`).join('')+
   `<span style="color:var(--g)">FLIP <b style="color:inherit">${LS.filter(i=>i.flip&&liveStatus(i)!=='CLOSED').length}</b></span><span>NO PIN <b>${LS.filter(i=>!hasPos(i)).length}</b></span><span style="color:var(--a)">ENDING SOON <b style="color:inherit">${end}</b></span><span>REMOVED THIS BUILD <b>${DATA.removed_count}</b></span>`;
}
const hud=document.getElementById('hud');
hud.innerHTML='<div class="cglow">// LEGEND</div>'+Object.entries(CAT).map(([k,c])=>`<div><span class="sw" style="background:${c};box-shadow:0 0 6px ${c}"></span>${k}</div>`).join('')+
 '<div><span class="sw" style="background:#fff;border-radius:0;transform:rotate(45deg)"></span>ORIGIN 02339</div><div style="color:#2f8f66">--- 300 MI RING · ··· 100 MI</div><div style="color:#2f8f66">● N = CLUSTER (CLICK TO EXPAND)</div>';
document.getElementById('built').textContent='BUILD '+DATA.built_display;
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-US',{hour12:false,timeZone:'America/New_York'})+' ET',1000);
if(location.hash==='#groups'){state.view='groups';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.v==='groups'));}
render(); setInterval(render,60000);

/* ---------- boot ---------- */
(function(){
  const boot=document.getElementById('boot'), out=document.getElementById('bootText');
  const lines=["LOT-RECON v1.1 :: secure terminal","> init uplink ............. OK","> load geo grid [ESRI/dark_gray] ... OK",
   `> anchor origin ${O.zip} ${O.lat.toFixed(4)},${O.lon.toFixed(4)} ... LOCKED`,`> radius ${O.radius_mi} mi .......... ARMED`,
   `> ingest feed: ${LS.length} targets (${DATA.removed_count} purged) ... OK`,"> sources: craigslist / offerup / ebay / hibid / mercari / geebo / auction houses",`> cluster: ${new Set(LS.map(i=>i.group)).size} location groups ... OK`,"> status: LIVE", "", "ACCESS GRANTED"];
  let li=0,ci=0,done=false,txt='';
  const finish=()=>{if(done)return;done=true;boot.style.transition='opacity .5s';boot.style.opacity=0;setTimeout(()=>{boot.remove();m.invalidateSize();},500);};
  boot.onclick=finish; addEventListener('keydown',finish,{once:true});
  (function tick(){ if(done) return; if(li>=lines.length){setTimeout(finish,500);return;}
    const l=lines[li]; if(ci<=l.length){out.textContent=txt+l.slice(0,ci);ci+=2;setTimeout(tick,12);}
    else{txt+=l+'\n';li++;ci=0;setTimeout(tick,90);} })();
})();
</script>
</body>
</html>
